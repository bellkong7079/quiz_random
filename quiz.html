<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>프로그래밍기능사 모의고사 60문항</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Malgun Gothic', sans-serif; background: #f0f2f5; color: #222; }

  header {
    background: linear-gradient(135deg, #1a73e8, #0d47a1);
    color: white;
    padding: 24px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  header h1 { font-size: 1.3rem; }
  #score-board {
    display: flex;
    gap: 20px;
    font-size: 0.95rem;
  }
  .sb-item { text-align: center; }
  .sb-num { font-size: 1.4rem; font-weight: bold; }
  .sb-label { font-size: 0.75rem; opacity: 0.85; }

  .progress-bar-wrap { background: rgba(255,255,255,0.25); height: 6px; border-radius: 3px; margin-top: 10px; }
  .progress-bar { height: 6px; background: #fff; border-radius: 3px; transition: width 0.4s; }

  main { max-width: 860px; margin: 32px auto; padding: 0 16px 60px; }

  .section-title {
    font-size: 1rem;
    font-weight: bold;
    color: #1a73e8;
    border-left: 4px solid #1a73e8;
    padding-left: 10px;
    margin: 36px 0 16px;
  }

  .question-card {
    background: white;
    border-radius: 12px;
    padding: 22px 24px;
    margin-bottom: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    transition: box-shadow 0.2s;
  }
  .question-card:hover { box-shadow: 0 3px 12px rgba(0,0,0,0.12); }

  .q-header { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
  .q-num {
    background: #1a73e8; color: white;
    border-radius: 50%; min-width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.8rem; font-weight: bold; flex-shrink: 0;
  }
  .q-text { font-size: 0.97rem; line-height: 1.6; }

  pre.code {
    background: #1e1e2e;
    color: #cdd6f4;
    padding: 14px 16px;
    border-radius: 8px;
    font-size: 0.85rem;
    margin: 10px 0 14px;
    overflow-x: auto;
    font-family: 'Consolas', 'Courier New', monospace;
    line-height: 1.55;
  }

  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  @media (max-width: 500px) { .choices { grid-template-columns: 1fr; } }

  .choice-btn {
    background: #f8f9fa;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    padding: 10px 14px;
    text-align: left;
    cursor: pointer;
    font-size: 0.9rem;
    font-family: inherit;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .choice-btn:hover:not(:disabled) { background: #e8f0fe; border-color: #1a73e8; }
  .choice-num {
    background: #e0e0e0; color: #444;
    border-radius: 50%; min-width: 22px; height: 22px;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.78rem; font-weight: bold; flex-shrink: 0;
  }

  .choice-btn.correct { background: #e6f4ea; border-color: #34a853; }
  .choice-btn.correct .choice-num { background: #34a853; color: white; }
  .choice-btn.wrong { background: #fce8e6; border-color: #ea4335; }
  .choice-btn.wrong .choice-num { background: #ea4335; color: white; }
  .choice-btn.reveal { background: #e6f4ea; border-color: #34a853; opacity: 0.7; }
  .choice-btn.reveal .choice-num { background: #34a853; color: white; }
  .choice-btn:disabled { cursor: default; }

  .result-msg {
    margin-top: 10px;
    font-size: 0.88rem;
    font-weight: bold;
    display: none;
  }
  .result-msg.show { display: block; }
  .result-msg.ok { color: #34a853; }
  .result-msg.ng { color: #ea4335; }

  #reset-btn {
    display: block;
    margin: 40px auto 0;
    background: #1a73e8;
    color: white;
    border: none;
    border-radius: 10px;
    padding: 14px 40px;
    font-size: 1rem;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.2s;
  }
  #reset-btn:hover { background: #1558b0; }

  #final-modal {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 200;
    align-items: center; justify-content: center;
  }
  #final-modal.show { display: flex; }
  .modal-box {
    background: white; border-radius: 16px;
    padding: 40px 48px; text-align: center;
    max-width: 360px; width: 90%;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
  .modal-box h2 { font-size: 1.5rem; margin-bottom: 8px; }
  .modal-score { font-size: 3rem; font-weight: bold; color: #1a73e8; margin: 16px 0; }
  .modal-box p { color: #555; font-size: 0.95rem; margin-bottom: 24px; }
  .modal-btn {
    background: #1a73e8; color: white; border: none;
    border-radius: 8px; padding: 12px 32px;
    font-size: 1rem; font-family: inherit; cursor: pointer;
  }
  .modal-btn:hover { background: #1558b0; }
</style>
</head>
<body>

<header>
  <div>
    <h1>프로그래밍기능사 모의고사</h1>

    </div>
  </div>
  <div id="score-board">

    <div class="sb-item">
      <div class="sb-num" id="sb-wrong">0</div>
      <div class="sb-label">오답</div>
    </div>
  </div>
</header>

<main id="quiz-container"></main>

<div id="final-modal">
  <div class="modal-box">
    <h2>시험 완료!</h2>
    <div class="modal-score" id="modal-score"></div>
    <p id="modal-msg"></p>
    <button class="modal-btn" onclick="resetAll()">다시 풀기</button>
  </div>
</div>

let answered = 0, correct = 0, wrong = 0;
const total = questions.length;

function buildQuiz() {
  const container = document.getElementById('quiz-container');
  container.innerHTML = '';
  let currentSection = '';

  questions.forEach((q, idx) => {
    if (q.section && q.section !== currentSection) {
      currentSection = q.section;
      const st = document.createElement('div');
      st.className = 'section-title';
      st.textContent = '[ ' + currentSection + ' ]';
      container.appendChild(st);
    }

    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = 'q' + idx;

    const qText = q.q.replace(/\n/g, '<br>');
    card.innerHTML = `
      <div class="q-header">
        <div class="q-num">${idx + 1}</div>
        <div class="q-text">${qText}</div>
      </div>
      ${q.code ? `<pre class="code">${escHtml(q.code)}</pre>` : ''}
      <div class="choices" id="choices-${idx}"></div>
      <div class="result-msg" id="msg-${idx}"></div>
    `;

    container.appendChild(card);

    const choicesDiv = card.querySelector('#choices-' + idx);
    const nums = ['①', '②', '③', '④'];
    q.choices.forEach((c, ci) => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.innerHTML = `<span class="choice-num">${nums[ci]}</span>${c}`;
      btn.onclick = () => selectAnswer(idx, ci);
      choicesDiv.appendChild(btn);
    });
  });

  container.insertAdjacentHTML('beforeend',
    '<button id="reset-btn" onclick="resetAll()">처음부터 다시 풀기</button>');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function selectAnswer(qIdx, chosen) {
  const btns = document.querySelectorAll(`#choices-${qIdx} .choice-btn`);
  btns.forEach(b => b.disabled = true);

  const correct_idx = questions[qIdx].answer;
  const msg = document.getElementById('msg-' + qIdx);

  btns[chosen].classList.add(chosen === correct_idx ? 'correct' : 'wrong');
  if (chosen !== correct_idx) {
    btns[correct_idx].classList.add('reveal');
  }

  msg.classList.add('show');
  if (chosen === correct_idx) {
    msg.textContent = '✔ 정답입니다!';
    msg.classList.add('ok');
    correct++;
  } else {
    msg.textContent = `✘ 오답! 정답은 ${['①','②','③','④'][correct_idx]}번입니다.`;
    msg.classList.add('ng');
    wrong++;
  }

  answered++;
  updateScoreBoard();

  if (answered === total) {
    setTimeout(showFinal, 600);
  }
}

function updateScoreBoard() {
  document.getElementById('sb-answered').textContent = answered;
  document.getElementById('sb-correct').textContent = correct;
  document.getElementById('sb-wrong').textContent = wrong;
  document.getElementById('prog-bar').style.width = (answered / total * 100) + '%';
}

function showFinal() {
  const pct = Math.round(correct / total * 100);
  document.getElementById('modal-score').textContent = correct + ' / ' + total + '점  (' + pct + '%)';
  let msg = '';
  if (pct >= 80) msg = '합격권입니다! 훌륭해요!';
  else if (pct >= 60) msg = '조금만 더 노력하면 합격할 수 있어요!';
  else msg = '취약 부분을 집중적으로 복습해 보세요.';
  document.getElementById('modal-msg').textContent = msg;
  document.getElementById('final-modal').classList.add('show');
}

function resetAll() {
  answered = 0; correct = 0; wrong = 0;
  document.getElementById('final-modal').classList.remove('show');
  updateScoreBoard();
  buildQuiz();
  window.scrollTo(0, 0);
}

buildQuiz();
